name: Bug report
description: Something is broken, ugly, or crashes.
title: 'fix: '
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for taking the time to report a problem. Screenshots and console output
        make a fix dramatically faster.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the problem and what you expected instead.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the site with...
        2. Choose the school...
        3. See...
    validations:
      required: true

  - type: input
    id: url
    attributes:
      label: Shareable URL
      description: The full URL, including query parameters, if the problem is visual.
      placeholder: https://.../?city=...&school=...&seed=...
    validations:
      required: false

  - type: dropdown
    id: school
    attributes:
      label: School
      options:
        - turner
        - rothko
        - hokusai
        - not school-specific

  - type: dropdown
    id: browser
    attributes:
      label: Browser
      options:
        - Chrome / Edge
        - Firefox
        - Safari
        - Other
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Device and console output
      description: Operating system, GPU if known, and any errors from the browser console.
      render: shell
    validations:
      required: false
